name: Bug report
description: Something doesn't work (the card doesn't show, shows wrong info, the app crashes...)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please run **`ytm-beacon doctor`** first. It often tells you the fix, and
        if not, its output is exactly what we need.
        Also check [Troubleshooting](https://github.com/dash1101/ytm-beacon/blob/main/docs/TROUBLESHOOTING.md).
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ytm-beacon doctor`
      description: Paste everything. (Or use "Copy diagnostics" on the dashboard at http://127.0.0.1:41713/.)
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "e.g. Brave 1.80, Firefox 140"
    validations:
      required: true
  - type: input
    id: discord
    attributes:
      label: Discord app
      description: Native, Flatpak, Snap, Vesktop, Canary, Microsoft Store...
      placeholder: "e.g. Discord (Flatpak)"
    validations:
      required: true
